<h2>Reset your VocalStep password</h2>
<p>Follow this link to choose a new password:</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password">Choose a new password</a></p>
<p>If you did not ask to reset your password, you can ignore this email. Your password stays the same.</p>
